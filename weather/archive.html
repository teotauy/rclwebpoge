<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archive · Where in the Weather</title>
<style>
  :root { --bg:#f2f2f1; --fg:#1b1b1a; --muted:#6a6a67; --line:#d6d6d2; --accent:#1b1b1a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ececea; --muted:#9a9a95; --line:#3a3a37; --accent:#ececea; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.5 Georgia, serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-weight: 400; font-size: 2rem; margin: 0 0 4px; }
  h1 a { color: inherit; text-decoration: none; }
  .sub { color: var(--muted); margin: 0 0 20px; font: 14px/1.4 system-ui, sans-serif; }
  .sub a, ol a { color: inherit; }
  ol { list-style: none; padding: 0; margin: 0; }
  li { display: grid; grid-template-columns: 3.2rem 1fr auto; gap: 12px; align-items: baseline; border-top: 1px solid var(--line); padding: 12px 0; }
  .num { font: 600 15px system-ui; text-decoration: none; }
  .when { text-decoration: none; }
  .stat { font: 14px system-ui; color: var(--muted); text-decoration: none; }
  li:hover .stat { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1><a id="today-link" href="./">Where in the Weather</a></h1>
  <p class="sub">Archive. Answers stay hidden. <a id="today-link-2" href="./">Today's puzzle</a></p>
  <ol id="list"><li>Loading…</li></ol>
</main>
<script type="module" src="archive.js"></script>
</body>
</html>
