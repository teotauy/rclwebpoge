<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where in the Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<script>
(function () {
  var path = location.pathname;
  var dir = path.replace(/\/(archive\.html|index\.html|archive)\/?$/, "");
  if (dir.endsWith("/")) dir = dir.slice(0, -1);
  document.write('<link rel="stylesheet" href="' + (dir || "") + '/wx.css">');
})();
</script>
</head>
<body>
<main>
  <header class="mast">
    <div>
      <p class="kicker">Surface bulletin</p>
      <h1>Where in the Weather</h1>
      <p class="meta"><span id="edition"></span><span class="meta-links"><a id="archive-link" href="archive">Archive</a><a href="/movies">Movies</a></span></p>
      <p class="sub">Guess the US city from its weather. Three guesses. Each extra clue costs points.</p>
    </div>
    <svg class="rose" viewBox="0 0 80 86" aria-hidden="true">
      <text x="40" y="9" text-anchor="middle" font-size="8" font-family="IBM Plex Mono, ui-monospace, monospace" fill="currentColor">N</text>
      <circle cx="40" cy="46" r="28" fill="none" stroke="currentColor" stroke-width="1.25"/>
      <path d="M40 20 L44.2 46 L40 42.2 L35.8 46 Z" fill="currentColor"/>
      <path d="M40 72 L35.8 46 L40 49.8 L44.2 46 Z" fill="currentColor" opacity="0.35"/>
      <path d="M14 46 L40 41.8 L36.2 46 L40 50.2 Z" fill="currentColor" opacity="0.35"/>
      <path d="M66 46 L40 50.2 L43.8 46 L40 41.8 Z" fill="currentColor" opacity="0.35"/>
      <circle cx="40" cy="46" r="1.8" fill="var(--paper)"/>
      <circle cx="40" cy="46" r="1.8" fill="none" stroke="currentColor"/>
    </svg>
  </header>
  <div id="banner"></div>
  <div id="app">Loading…</div>
  <p class="attr" id="attr"></p>
</main>
<script type="module" src="/weather/app.js"></script>
</body>
</html>
